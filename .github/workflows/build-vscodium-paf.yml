name: Build VSCodium PortableApps PAF (Manual)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Official stable VSCodium version (example 1.140.06880)'
        type: string
        required: true
        default: '1.140.06880'
      architecture:
        description: 'Windows architecture (most PCs use x64)'
        type: choice
        required: true
        default: x64
        options:
          - x64
          - arm64

permissions:
  contents: read

concurrency:
  group: vscodium-paf-builder
  cancel-in-progress: false

jobs:
  build-paf:
    name: Build ready-to-install PortableApps.com installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Get files from your builder repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check builder scripts
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Download and verify official VSCodium Windows release
        shell: pwsh
        env:
          VSCODIUM_VERSION: ${{ inputs.release_version }}
          VSCODIUM_ARCHITECTURE: ${{ inputs.architecture }}
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          python builder/build_portable.py --version "$env:VSCODIUM_VERSION" --architecture "$env:VSCODIUM_ARCHITECTURE" --output-dir stage
          if ($LASTEXITCODE -ne 0) { throw 'The official VSCodium download or verification failed.' }

      - name: Build portable launcher with VSCodium official icon
        shell: pwsh
        run: |
          & ./builder/compile_launcher.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Portable launcher compilation failed.' }

      - name: Build and verify portable ZIP layout (internal safety check)
        shell: pwsh
        env:
          VSCODIUM_VERSION: ${{ inputs.release_version }}
          VSCODIUM_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          python builder/package_staged.py --version "$env:VSCODIUM_VERSION" --architecture "$env:VSCODIUM_ARCHITECTURE"
          if ($LASTEXITCODE -ne 0) { throw 'Portable layout verification failed.' }

      - name: Produce ready-made .paf.exe using official PortableApps.com Installer
        shell: pwsh
        env:
          VSCODIUM_VERSION: ${{ inputs.release_version }}
          VSCODIUM_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          & ./builder/build_paf.ps1 -Version "$env:VSCODIUM_VERSION" -Architecture "$env:VSCODIUM_ARCHITECTURE"
          if ($LASTEXITCODE -ne 0) { throw 'PortableApps.com installer packaging failed.' }

      - name: Upload ready-to-install PAF
        uses: actions/upload-artifact@v4
        with:
          name: VSCodium-PAF-${{ inputs.release_version }}-${{ inputs.architecture }}
          path: dist/*.paf.exe
          if-no-files-found: error
          retention-days: 7
